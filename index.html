<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        img, video {
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }

        h2 {
            color: #333;
        }
    </style>
</head>

<body>

    <header>
        <h1 id="name"></h1>
        <p>Welcome to My Personal Portfolio</p>
    </header>

    <div class="container">

        <h2>About Me</h2>
        <p id="description"></p>

        <h2>My Photo</h2>
        <img src="https://raw.githubusercontent.com/Yousef-qweasd/helk/refs/heads/main/x.jpe" alt="Personal Photo">

        <h2>My Video</h2>
        <video controls>
            <source src="https://raw.githubusercontent.com/Yousef-qweasd/helk/refs/heads/main/xv.mp4" type="video/mp4">
        </video>

        <h2>My Skills</h2>
        <p>Creativity, Communication, Problem Solving, and Teamwork.</p>

    </div>

    <script>
        // Change personal information here
        const personName = "Eyad Hossam Hosny";

        const description =
            "Hello! I am a passionate and creative person who loves learning new things, developing skills, and exploring new opportunities. I always try to improve myself and achieve my goals.";

        document.getElementById("name").textContent = personName;
        document.getElementById("description").textContent = description;
    </script>

</body>
</html>
